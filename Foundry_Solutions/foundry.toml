
#____________________________________Development Profile___________________________________________________________________________________________________
[profile.default]


src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200


[rpc_endpoints]
sepolia = "${sepolia}"
mainnet = "${mainnet}"
polygon = "${polygon}"
amoy = "${amoy}"
bsc_mainnet = "${bsc_mainnet}"
bsc_testnet = "${bsc_testnet}"
base_mainnet = "${base_mainnet}"
local = "http://127.0.0.1:8545"


[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }




#____________________________________Production Profile___________________________________________________________________________________________________
[profile.production]


via_ir = true
optimizer = true
optimizer_runs = 200


